<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOLT — Run Faster</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;900&display=swap');

  :root{
    --ink:#0d0d0d;
    --ink-2:#1a1a1a;
    --ink-3:#242424;
    --paper:#f3f2ee;
    --paper-dim:#c9c7bd;
    --volt:#d4ff3d;
    --ember:#ff4d23;
    --line:rgba(243,242,238,0.14);
    --vc-body:#e7e5df; --vc-accent:#d4ff3d; --vc-sole:#141414;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--ink); color:var(--paper); font-family:'Inter',sans-serif; overflow-x:hidden;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}
  }
  ::selection{background:var(--volt); color:var(--ink);}
  h1,h2,h3{font-family:'Archivo Black',sans-serif; font-weight:400; line-height:0.95; letter-spacing:-0.01em;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--volt); outline-offset:3px;}

  /* ---------- NAV ---------- */
  nav{
    position:fixed; top:0; left:0; right:0; z-index:200;
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 5vw;
    background:rgba(13,13,13,0.7);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{font-family:'Archivo Black'; font-size:20px; letter-spacing:0.02em;}
  .brand span{color:var(--volt);}
  .nav-links{display:none; gap:36px; font-size:14px; font-weight:600;}
  .nav-links a{opacity:0.8; transition:opacity .2s; padding-bottom:2px; border-bottom:1px solid transparent;}
  .nav-links a:hover, .nav-links a.active{opacity:1; border-color:var(--volt);}
  @media(min-width:760px){ .nav-links{display:flex;} }
  .nav-right{display:flex; align-items:center; gap:18px;}
  .cart-btn{
    position:relative; background:none; border:1px solid var(--line);
    width:42px; height:42px; border-radius:50%; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:var(--paper);
    transition:border-color .2s, transform .2s;
  }
  .cart-btn:hover{border-color:var(--paper); transform:translateY(-2px);}
  .cart-btn svg{width:18px; height:18px;}
  .cart-badge{
    position:absolute; top:-6px; right:-6px;
    background:var(--volt); color:var(--ink);
    font-size:11px; font-weight:700;
    width:19px; height:19px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    transform:scale(0); transition:transform .25s cubic-bezier(.3,1.5,.5,1);
  }
  .cart-badge.show{transform:scale(1);}

  main{padding-top:0;}
  .page{animation:fadeIn .4s ease;}
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }

  .btn{
    background:var(--volt); color:var(--ink); font-weight:700; font-size:14px;
    padding:16px 30px; border:none; border-radius:100px; cursor:pointer;
    transition:transform .25s cubic-bezier(.2,.9,.3,1.3), background .2s;
  }
  .btn:hover{transform:translateY(-3px); background:#e6ff85;}
  .btn:active{transform:translateY(0);}
  .btn:disabled{opacity:0.4; cursor:not-allowed; transform:none;}
  .btn-ghost{
    background:none; border:1px solid var(--line); color:var(--paper);
    padding:15px 26px; border-radius:100px; font-size:14px; font-weight:600; cursor:pointer;
    transition:border-color .2s, transform .2s;
  }
  .btn-ghost:hover{border-color:var(--paper); transform:translateY(-2px);}
  .btn-sm{padding:10px 20px; font-size:13px;}

  /* ---------- HERO ---------- */
  .hero{ position:relative; min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:140px 5vw 60px; overflow:hidden; }
  .hero-bg-text{
    position:absolute; top:52%; left:50%; transform:translate(-50%,-50%);
    font-family:'Archivo Black'; font-size:min(28vw,320px); color:transparent;
    -webkit-text-stroke:1px var(--line); white-space:nowrap; letter-spacing:-0.03em;
    user-select:none; z-index:0; pointer-events:none;
  }
  .hero-grid{ position:relative; z-index:2; display:grid; grid-template-columns:1fr; align-items:center; gap:20px; }
  @media(min-width:900px){ .hero-grid{grid-template-columns:1fr 1.1fr;} }
  .eyebrow{ font-size:13px; font-weight:700; color:var(--volt); margin-bottom:18px; display:flex; align-items:center; gap:10px; }
  .eyebrow::before{content:''; width:26px; height:2px; background:var(--volt); display:inline-block;}
  .hero-copy h1{font-size:clamp(48px,8vw,104px); margin-bottom:22px;}
  .hero-copy p{max-width:38ch; font-size:17px; line-height:1.6; color:var(--paper-dim); margin-bottom:34px;}
  .cta-row{display:flex; align-items:center; gap:24px; flex-wrap:wrap;}

  .colorways{display:flex; gap:14px; margin-top:28px; align-items:center; flex-wrap:wrap;}
  .cw-label{font-size:12px; font-weight:700; color:var(--paper-dim); margin-right:6px;}
  .swatch{width:30px; height:30px; border-radius:50%; border:2px solid transparent; cursor:pointer; transition:transform .2s, border-color .2s; position:relative;}
  .swatch:hover{transform:scale(1.12);}
  .swatch.active{border-color:var(--paper);}
  .swatch.active::after{content:''; position:absolute; inset:-6px; border:1px solid var(--paper); border-radius:50%; opacity:0.5;}
  .cw-name{font-size:12px; color:var(--paper-dim); margin-top:10px;}

  /* ---------- 3D SHOE STAGE ---------- */
  .stage{ position:relative; height:56vh; min-height:380px; perspective:1400px; display:flex; align-items:center; justify-content:center; cursor:grab; touch-action:none; }
  .stage:active{cursor:grabbing;}
  .stage-hint{ position:absolute; bottom:0; left:50%; transform:translateX(-50%); font-size:12px; color:var(--paper-dim); font-weight:600; display:flex; align-items:center; gap:8px; opacity:0.7; }
  .stage-hint svg{width:16px; height:16px;}
  .shoe3d{ position:relative; width:340px; height:340px; transform-style:preserve-3d; transform:rotateX(6deg) rotateY(-18deg); }
  .layer{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .layer svg{width:100%; height:100%; overflow:visible;}
  .l-shadow{ transform:translateZ(-60px) translateY(120px) scale(1.1); }
  .l-sole{   transform:translateZ(-30px); }
  .l-body{   transform:translateZ(0px); }
  .l-collar{ transform:translateZ(14px); }
  .l-swoop{  transform:translateZ(26px); }
  .l-lace{   transform:translateZ(40px); }
  .l-tag{    transform:translateZ(52px); }
  .fill-body{fill:var(--vc-body);}
  .fill-accent{fill:var(--vc-accent);}
  .fill-sole{fill:var(--vc-sole);}
  .fill-dark{fill:#141414;}

  /* ---------- MARQUEE ---------- */
  .marquee{ border-top:1px solid var(--line); border-bottom:1px solid var(--line); overflow:hidden; white-space:nowrap; padding:18px 0; }
  .marquee-track{ display:inline-flex; gap:60px; animation:scroll 22s linear infinite; }
  .marquee-track span{ font-family:'Archivo Black'; font-size:22px; color:var(--paper-dim); display:flex; align-items:center; gap:60px; }
  .marquee-track span em{font-style:normal; color:var(--volt);}
  @keyframes scroll{ from{transform:translateX(0);} to{transform:translateX(-50%);} }

  /* ---------- SECTIONS ---------- */
  .section{padding:110px 5vw;}
  .section-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:24px; margin-bottom:56px; flex-wrap:wrap; }
  .section-head h2{font-size:clamp(30px,5vw,52px); max-width:14ch;}
  .section-head p{color:var(--paper-dim); max-width:34ch; font-size:15px; line-height:1.6;}

  .feature-grid{ display:grid; grid-template-columns:1fr; gap:1px; background:var(--line); border:1px solid var(--line); }
  @media(min-width:760px){ .feature-grid{grid-template-columns:repeat(3,1fr);} }
  .feature{ background:var(--ink); padding:40px 32px; transition:background .3s; }
  .feature:hover{background:var(--ink-2);}
  .feature .num{font-size:13px; color:var(--volt); font-weight:700; margin-bottom:26px; display:block;}
  .feature h3{font-size:21px; margin-bottom:14px; font-family:'Inter'; font-weight:700; letter-spacing:-0.01em;}
  .feature p{color:var(--paper-dim); font-size:14.5px; line-height:1.65;}

  .stats{ display:grid; grid-template-columns:repeat(2,1fr); gap:40px; }
  @media(min-width:760px){ .stats{grid-template-columns:repeat(4,1fr);} }
  .stat h3{font-size:clamp(38px,6vw,68px); color:var(--volt); font-family:'Archivo Black';}
  .stat p{font-size:13px; color:var(--paper-dim); margin-top:8px; font-weight:600;}

  /* ---------- SHOP GRID ---------- */
  .filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:44px;}
  .pill{
    padding:10px 20px; border-radius:100px; border:1px solid var(--line); background:none; color:var(--paper-dim);
    font-size:13px; font-weight:600; cursor:pointer; transition:all .2s;
  }
  .pill:hover{border-color:var(--paper); color:var(--paper);}
  .pill.active{background:var(--volt); color:var(--ink); border-color:var(--volt);}

  .product-grid{ display:grid; grid-template-columns:1fr; gap:22px; }
  @media(min-width:600px){ .product-grid{grid-template-columns:repeat(2,1fr);} }
  @media(min-width:980px){ .product-grid{grid-template-columns:repeat(3,1fr);} }

  .pcard{
    background:var(--ink-2); border-radius:20px; padding:26px; display:flex; flex-direction:column;
    transform-style:preserve-3d; will-change:transform;
    transition:transform .15s ease, box-shadow .3s ease;
    cursor:pointer;
  }
  .pcard:hover{box-shadow:0 20px 50px -20px rgba(0,0,0,0.6);}
  .pcard .chip{
    width:100%; aspect-ratio:1.4; border-radius:14px; margin-bottom:20px;
    display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;
  }
  .pcard .chip svg{width:70%; opacity:0.95;}
  .pcard .cat{font-size:11px; font-weight:700; color:var(--volt); margin-bottom:8px; letter-spacing:0.02em;}
  .pcard h4{font-family:'Inter'; font-weight:700; font-size:17px; margin-bottom:6px;}
  .pcard .tagline{color:var(--paper-dim); font-size:13px; margin-bottom:18px; flex:1;}
  .pcard .row{display:flex; justify-content:space-between; align-items:center;}
  .pcard .price{font-weight:700; font-size:15px;}
  .pcard .arrow{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; transition:background .2s, transform .2s;
  }
  .pcard:hover .arrow{background:var(--volt); transform:rotate(45deg);}
  .pcard:hover .arrow svg{stroke:var(--ink);}
  .pcard .arrow svg{width:14px; height:14px; stroke:var(--paper); transition:stroke .2s;}

  /* ---------- PRODUCT PAGE ---------- */
  .product-page{padding:140px 5vw 100px;}
  .product-layout{display:grid; grid-template-columns:1fr; gap:40px;}
  @media(min-width:940px){ .product-layout{grid-template-columns:1.2fr 1fr;} }
  .back-link{display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--paper-dim); margin-bottom:30px;}
  .back-link:hover{color:var(--paper);}
  .product-info .cat-tag{font-size:12px; font-weight:700; color:var(--volt); margin-bottom:14px;}
  .product-info h1{font-size:clamp(32px,5vw,52px); margin-bottom:14px;}
  .product-info .tagline{color:var(--paper-dim); font-size:16px; margin-bottom:20px;}
  .product-info .price{font-size:24px; font-weight:800; margin-bottom:26px;}
  .product-info .desc{color:var(--paper-dim); font-size:14.5px; line-height:1.7; max-width:48ch; margin-bottom:32px;}

  .size-label{font-size:12px; font-weight:700; color:var(--paper-dim); margin-bottom:12px;}
  .size-grid{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:8px;}
  .size-pill{
    width:52px; height:44px; border-radius:10px; border:1px solid var(--line); background:none; color:var(--paper);
    font-size:13px; font-weight:600; cursor:pointer; transition:all .2s;
  }
  .size-pill:hover{border-color:var(--paper);}
  .size-pill.active{background:var(--volt); border-color:var(--volt); color:var(--ink);}
  .size-warn{color:var(--ember); font-size:12.5px; margin:10px 0 20px; height:14px; opacity:0; transition:opacity .2s;}
  .size-warn.show{opacity:1;}

  .add-row{display:flex; align-items:center; gap:18px; margin-top:26px; flex-wrap:wrap;}
  .added-flag{font-size:13px; font-weight:700; color:var(--volt); display:flex; align-items:center; gap:8px; opacity:0; transform:translateX(-6px); transition:all .3s;}
  .added-flag.show{opacity:1; transform:translateX(0);}

  /* ---------- CART DRAWER ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:300; opacity:0; pointer-events:none; transition:opacity .3s;
  }
  .overlay.open{opacity:1; pointer-events:auto;}
  .cart-drawer{
    position:fixed; top:0; right:0; bottom:0; width:min(420px,92vw); background:var(--ink-2); z-index:301;
    transform:translateX(100%); transition:transform .35s cubic-bezier(.2,.9,.2,1);
    display:flex; flex-direction:column; border-left:1px solid var(--line);
  }
  .cart-drawer.open{transform:translateX(0);}
  .cart-head{padding:26px 26px 20px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line);}
  .cart-head h3{font-family:'Inter'; font-weight:800; font-size:18px;}
  .cart-close{background:none; border:none; color:var(--paper); cursor:pointer; width:32px; height:32px; display:flex; align-items:center; justify-content:center;}
  .cart-close svg{width:18px; height:18px;}
  .cart-items{flex:1; overflow-y:auto; padding:20px 26px;}
  .cart-empty{color:var(--paper-dim); font-size:14px; text-align:center; padding:60px 0;}
  .cart-item{display:flex; gap:14px; padding:16px 0; border-bottom:1px solid var(--line);}
  .cart-item .chip-sm{width:64px; height:52px; border-radius:8px; flex-shrink:0;}
  .cart-item .ci-body{flex:1;}
  .cart-item h5{font-size:14px; font-weight:700; margin-bottom:3px;}
  .cart-item .meta{font-size:12px; color:var(--paper-dim);}
  .cart-item .ci-row{display:flex; justify-content:space-between; align-items:center; margin-top:8px;}
  .cart-item .remove{background:none; border:none; color:var(--paper-dim); font-size:12px; cursor:pointer; text-decoration:underline;}
  .cart-item .remove:hover{color:var(--ember);}
  .cart-foot{padding:22px 26px; border-top:1px solid var(--line);}
  .cart-foot .subtotal{display:flex; justify-content:space-between; font-size:15px; font-weight:700; margin-bottom:16px;}
  .cart-foot .btn{width:100%;}

  /* ---------- CONTACT ---------- */
  .contact-page{padding:150px 5vw 120px; max-width:640px;}
  .field{margin-bottom:22px;}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--paper-dim); margin-bottom:10px;}
  .field input, .field textarea{
    width:100%; background:var(--ink-2); border:1px solid var(--line); border-radius:10px; color:var(--paper);
    padding:14px 16px; font-family:'Inter'; font-size:14px; transition:border-color .2s;
  }
  .field input:focus, .field textarea:focus{border-color:var(--volt); outline:none;}
  .field textarea{resize:vertical; min-height:120px;}
  .field-error{color:var(--ember); font-size:12px; margin-top:6px; height:14px; opacity:0; transition:opacity .2s;}
  .field-error.show{opacity:1;}
  .success-panel{ text-align:center; padding:60px 20px; }
  .success-panel .tick{
    width:64px; height:64px; border-radius:50%; background:var(--volt); color:var(--ink);
    display:flex; align-items:center; justify-content:center; margin:0 auto 24px;
  }
  .success-panel h2{font-size:32px; margin-bottom:12px;}
  .success-panel p{color:var(--paper-dim); margin-bottom:28px;}

  /* ---------- FOOTER ---------- */
  .footer-cta{text-align:center; padding:140px 5vw 100px;}
  .footer-cta h2{font-size:clamp(40px,9vw,120px); margin-bottom:34px;}
  footer{
    padding:40px 5vw; border-top:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;
    font-size:13px; color:var(--paper-dim);
  }
  .foot-links{display:flex; gap:20px;}
  .foot-links a:hover{color:var(--paper);}

  /* ---------- TOAST ---------- */
  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px); z-index:400;
    background:var(--paper); color:var(--ink); padding:14px 24px; border-radius:100px; font-size:13px; font-weight:700;
    opacity:0; pointer-events:none; transition:all .35s cubic-bezier(.2,.9,.2,1);
    display:flex; align-items:center; gap:10px;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast .dot{width:8px; height:8px; border-radius:50%; background:var(--volt);}

  .reveal{opacity:0; transform:translateY(24px); transition:opacity .7s ease, transform .7s ease;}
  .reveal.in{opacity:1; transform:translateY(0);}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="soleShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="knitTexture" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#000000" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
</svg>
<nav>
  <a href="#/" class="brand">VOLT<span>°</span></a>
  <div class="nav-links" id="navLinks">
    <a href="#/shop" data-route="/shop">Shop</a>
    <a href="#/about" data-route="/about">Technology</a>
    <a href="#/contact" data-route="/contact">Contact</a>
  </div>
  <div class="nav-right">
    <button class="cart-btn" id="cartToggle" aria-label="Open cart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span class="cart-badge" id="cartBadge">0</span>
    </button>
  </div>
</nav>

<main id="app"></main>

<div class="overlay" id="overlay"></div>
<aside class="cart-drawer" id="cartDrawer">
  <div class="cart-head">
    <h3>Your bag</h3>
    <button class="cart-close" id="cartClose" aria-label="Close cart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-foot">
    <div class="subtotal"><span>Subtotal</span><span id="cartSubtotal">$0</span></div>
    <button class="btn" id="checkoutBtn">Checkout</button>
  </div>
</aside>

<div class="toast" id="toast"><span class="dot"></span><span id="toastMsg"></span></div>

<script>
/* ---------------- DATA ---------------- */
const PRODUCTS = [
  { id:'run-01', name:'VOLT RUN 01', category:'Running', price:160, silhouette:'low',
    tagline:'The original. Featherweight and fast.',
    description:'A featherweight racer built from a single knit upper and a reactive foam sole. Our most versatile everyday trainer.',
    colorways:[
      {name:'Bone / Volt', body:'#e7e5df', accent:'#d4ff3d', sole:'#141414'},
      {name:'Blackout / Ember', body:'#241d1a', accent:'#ff4d23', sole:'#0d0d0d'},
      {name:'Deep Sea / Ice', body:'#132538', accent:'#7ecbff', sole:'#0d0d0d'},
      {name:'Shadow / Volt', body:'#1a1a1a', accent:'#d4ff3d', sole:'#d4ff3d'},
    ]},
  { id:'run-02', name:'VOLT RUN 02 CARBON', category:'Running', price:210, silhouette:'low',
    tagline:'Race day. Carbon-plated speed.',
    description:'Our fastest shoe: a rigid curved plate sandwiched in dual-density foam for maximum propulsion off the line.',
    colorways:[
      {name:'Podium White', body:'#f3f2ee', accent:'#ff4d23', sole:'#1a1a1a'},
      {name:'Track Black', body:'#161616', accent:'#d4ff3d', sole:'#0d0d0d'},
      {name:'Signal Red', body:'#3a1210', accent:'#ff4d23', sole:'#0d0d0d'},
    ]},
  { id:'trail', name:'VOLT TRAIL', category:'Running', price:175, silhouette:'low',
    tagline:'Off the road, into the dirt.',
    description:'A rugged outsole with deep lugs and a reinforced toe cap, built for technical terrain and wet rock.',
    colorways:[
      {name:'Canyon', body:'#4a3324', accent:'#ff4d23', sole:'#2a1d15'},
      {name:'Storm', body:'#2c2f33', accent:'#7ecbff', sole:'#141414'},
    ]},

/* ---------------- SHOE STAGE DRAG ---------------- */
let dragState = null;
function initShoeStage(){
  const stage = document.getElementById('dragStage');
  const shoe = document.getElementById('shoe3d');
  if(!stage || !shoe) { dragState = null; return; }
  dragState = { rotY:-18, rotX:6, isDown:false, lastX:0, lastY:0, velY:-0.06, shoe };
  applyRotation();

  function pointerDown(x,y){ dragState.isDown = true; dragState.lastX = x; dragState.lastY = y; dragState.velY = 0; }
  function pointerMove(x,y){
    if(!dragState || !dragState.isDown) return;
    const dx = x - dragState.lastX, dy = y - dragState.lastY;
    dragState.rotY += dx * 0.35;
    dragState.rotX = Math.max(-20, Math.min(30, dragState.rotX - dy * 0.2));
    dragState.lastX = x; dragState.lastY = y;
    applyRotation();
  }
  function pointerUp(){ if(dragState) dragState.isDown = false; }

  stage.addEventListener('mousedown', e => pointerDown(e.clientX, e.clientY));
  window.addEventListener('mousemove', e => pointerMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', pointerUp);
  stage.addEventListener('touchstart', e => { const t=e.touches[0]; pointerDown(t.clientX,t.clientY); }, {passive:true});
  stage.addEventListener('touchmove', e => { const t=e.touches[0]; pointerMove(t.clientX,t.clientY); }, {passive:true});
  stage.addEventListener('touchend', pointerUp);
}
function applyRotation(){
  if(!dragState || !dragState.shoe) return;
  dragState.shoe.style.transform = `rotateX(${dragState.rotX}deg) rotateY(${dragState.rotY}deg)`;
}
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function idleLoop(){
  if(dragState && !dragState.isDown && !reduceMotion){
    dragState.rotY += dragState.velY;
    applyRotation();
  }
  requestAnimationFrame(idleLoop);
}
idleLoop();

      if(nameEl) nameEl.textContent = document.getElementById('cwNameLabel') ? p.colorways[i].name : ('Colorway — ' + p.colorways[i].name);
    });

}
function applyColorway(p, i){
  const cw = p.colorways[i];
  document.documentElement.style.setProperty('--vc-body', cw.body);

}

    const pid = el.dataset.product;
    const p = PRODUCTS.find(x=>x.id===pid);
    applyColorway(p, selectedColorway[pid] || 0);
    renderColorwaySwatches(el);
  });

  // product cards -> navigate
  document.querySelectorAll('.pcard[data-nav]').forEach(card=>{
    card.addEventListener('click', ()=>{ location.hash = '#' + card.dataset.nav; });
    card.addEventListener('mousemove', e=>{
      const r = card.getBoundingClientRect();
      const px = (e.clientX - r.left)/r.width - 0.5;
      const py = (e.clientY - r.top)/r.height - 0.5;
      card.style.transform = `perspective(700px) rotateY(${px*8}deg) rotateX(${-py*8}deg) translateY(-4px)`;
    });
    card.addEventListener('mouseleave', ()=>{ card.style.transform = ''; });
  });

  // shop filters
  const grid = document.getElementById('shopGrid');
  if(grid){
    document.querySelectorAll('.pill[data-filter]').forEach(pill=>{
      pill.addEventListener('click', ()=>{
        document.querySelectorAll('.pill[data-filter]').forEach(p=>p.classList.remove('active'));
        pill.classList.add('active');
        const f = pill.dataset.filter;
        const list = f==='All' ? PRODUCTS : PRODUCTS.filter(p=>p.category===f);
        grid.innerHTML = list.map(p=>productCard(p)).join('');
        // re-wire the new cards
        document.querySelectorAll('.pcard[data-nav]').forEach(card=>{
          card.addEventListener('click', ()=>{ location.hash = '#' + card.dataset.nav; });
          card.addEventListener('mousemove', e=>{
            const r = card.getBoundingClientRect();
            const px = (e.clientX - r.left)/r.width - 0.5;
            const py = (e.clientY - r.top)/r.height - 0.5;
            card.style.transform = `perspective(700px) rotateY(${px*8}deg) rotateX(${-py*8}deg) translateY(-4px)`;
          });
          card.addEventListener('mouseleave', ()=>{ card.style.transform = ''; });
        });
      });
    });
  }

  // hero quick-add
  const heroAdd = document.getElementById('heroAddBtn');
  if(heroAdd){
    heroAdd.addEventListener('click', ()=>{
      const p = PRODUCTS[0];
      const cw = p.colorways[selectedColorway[p.id] || 0];
      cart.push({ name:p.name, colorway:cw.name, size:'—', price:p.price, body:cw.body, sole:cw.sole });
      renderCart(); updateCartBadge(); showToast(p.name + ' added to bag');
    });
  }

  // product page: size + add to bag
  const sizeGrid = document.getElementById('sizeGrid');
  if(sizeGrid){
    const pid = sizeGrid.dataset.product;
    sizeGrid.querySelectorAll('.size-pill').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        sizeGrid.querySelectorAll('.size-pill').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        selectedSize[pid] = btn.dataset.size;
        document.getElementById('sizeWarn').classList.remove('show');
      });
    });
  }
  const addBtn = document.getElementById('addToBagBtn');
  if(addBtn){
    addBtn.addEventListener('click', ()=>{
      const pid = addBtn.dataset.product;
      const p = PRODUCTS.find(x=>x.id===pid);
      if(!selectedSize[pid]){
        document.getElementById('sizeWarn').classList.add('show');
        return;
      }
      const cw = p.colorways[selectedColorway[pid] || 0];
      cart.push({ name:p.name, colorway:cw.name, size:selectedSize[pid], price:p.price, body:cw.body, sole:cw.sole });
      renderCart(); updateCartBadge();
      const flag = document.getElementById('addedFlag');
      flag.classList.add('show');
      setTimeout(()=>flag.classList.remove('show'), 2000);
      showToast(p.name + ' added to bag');
    });
  }

  // contact form
  const form = document.getElementById('contactForm');
  if(form){
    form.addEventListener('submit', e=>{
      e.preventDefault();
      const name = document.getElementById('cfName');
      const email = document.getElementById('cfEmail');
      const msg = document.getElementById('cfMsg');
      let valid = true;
      const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
      document.getElementById('errName').classList.toggle('show', name.value.trim()==='');
      document.getElementById('errEmail').classList.toggle('show', !emailOk);
      document.getElementById('errMsg').classList.toggle('show', msg.value.trim()==='');
      if(name.value.trim()==='' || !emailOk || msg.value.trim()===''){ valid = false; }
      if(!valid) return;
      document.getElementById('contactFormWrap').innerHTML = `
        <div class="success-panel">
          <div class="tick">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
          </div>
          <h2>Message sent</h2>
          <p>Thanks, ${name.value.trim().split(' ')[0]} — we'll get back to you within a day.</p>
          <button class="btn-ghost" id="sendAnother">Send another message</button>
        </div>`;
      document.getElementById('sendAnother').addEventListener('click', ()=>{
        document.getElementById('app').innerHTML = renderContact();
        afterRender('/contact');
      });
    });
  }

  // scroll reveal
  const observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){ entry.target.classList.add('in'); observer.unobserve(entry.target); }
    });
  }, {threshold:0.12});
  document.querySelectorAll('.reveal').forEach(el=>observer.observe(el));

  renderCart();
  updateCartBadge();
}

window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', render);
render();
</script>
</body>
</html>
